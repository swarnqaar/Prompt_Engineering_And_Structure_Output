<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interview the Candidate</title>
<style>
  :root {
    --bg: #eef2f7;
    --panel: #ffffff;
    --ink: #14213d;
    --muted: #5b6b85;
    --line: #d5deea;
    --hr: #1f3a8a;        /* interviewer (you) */
    --hr-ink: #ffffff;
    --cand: #e6edf8;      /* candidate answers */
    --err: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1424; --panel: #141d33; --ink: #e8edf7; --muted: #93a3c0;
      --line: #25324f; --hr: #3b5bdb; --cand: #1c2846; --err: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 16px/1.55 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    display: flex; justify-content: center;
  }
  .app {
    width: 100%; max-width: 760px; height: 100%;
    display: flex; flex-direction: column; background: var(--panel);
    border-left: 1px solid var(--line); border-right: 1px solid var(--line);
  }
  header { padding: 18px 22px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 1.15rem; font-weight: 650; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: .9rem; }

  #log { flex: 1; overflow-y: auto; padding: 20px 22px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 82%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; word-wrap: break-word; }
  .msg.hr { align-self: flex-end; background: var(--hr); color: var(--hr-ink); border-bottom-right-radius: 4px; }
  .msg.cand { align-self: flex-start; background: var(--cand); border-bottom-left-radius: 4px; }
  .msg.err { align-self: flex-start; background: transparent; color: var(--err); border: 1px solid var(--err); border-bottom-left-radius: 4px; }
  .who { display: block; font-size: .78rem; color: var(--muted); margin-bottom: 2px; }
  .msg.hr .who { color: rgba(255,255,255,.75); }

  .typing span { display: inline-block; width: 7px; height: 7px; margin-right: 4px; border-radius: 50%; background: var(--muted); animation: blink 1s infinite; }
  .typing span:nth-child(2) { animation-delay: .15s; }
  .typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  .empty { margin: auto; text-align: center; color: var(--muted); max-width: 420px; }
  .empty h2 { color: var(--ink); font-size: 1.05rem; margin: 0 0 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 14px; }
  .chips button {
    font: inherit; font-size: .88rem; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer;
  }
  .chips button:hover { border-color: var(--hr); }

  form { display: flex; gap: 10px; padding: 14px 22px; border-top: 1px solid var(--line); }
  input {
    flex: 1; font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 11px 14px;
  }
  #send {
    font: inherit; font-weight: 600; color: var(--hr-ink); background: var(--hr);
    border: 0; border-radius: 10px; padding: 0 20px; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
  :focus-visible { outline: 2px solid var(--hr); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .typing span { animation: none; opacity: .6; } }
  @media (max-width: 520px) { .msg { max-width: 92%; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Interview the candidate</h1>
    <p>Ask anything. Answers come only from the candidate's resume.</p>
  </header>

  <div id="log" aria-live="polite">
    <div class="empty" id="empty">
      <h2>Start the interview</h2>
      <p>Type a question below or pick one to begin.</p>
      <div class="chips" id="chips"></div>
    </div>
  </div>

  <form id="form">
    <input id="q" type="text" placeholder="Ask a question about the candidate…" autocomplete="off" aria-label="Your question" required>
    <button id="send" type="submit">Ask</button>
  </form>
</div>

<script>
  // Change this if your FastAPI server runs somewhere else.
  const API_URL = "http://localhost:8000/chat";

  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("q");
  const sendBtn = document.getElementById("send");
  const chips = document.getElementById("chips");

  ["Tell me about yourself.", "What are your key skills?", "Describe your work experience.",
   "What projects have you built?", "What is your education?", "How many years of experience do you have?"]
    .forEach(text => {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = text;
      b.onclick = () => ask(text);
      chips.appendChild(b);
    });

  function addMsg(kind, text, label) {
    const empty = document.getElementById("empty");
    if (empty) empty.remove();
    const el = document.createElement("div");
    el.className = "msg " + kind;
    if (label) {
      const who = document.createElement("span");
      who.className = "who"; who.textContent = label;
      el.appendChild(who);
    }
    el.appendChild(document.createTextNode(text));
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  function addTyping() {
    const el = addMsg("cand", "", "Candidate");
    const dots = document.createElement("span");
    dots.className = "typing";
    dots.innerHTML = "<span></span><span></span><span></span>";
    el.appendChild(dots);
    return el;
  }

  async function ask(question) {
    question = question.trim();
    if (!question) return;
    addMsg("hr", question, "You");
    input.value = "";
    sendBtn.disabled = true; input.disabled = true;
    const typing = addTyping();
    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question })
      });
      if (!res.ok) throw new Error("Server returned " + res.status);
      const data = await res.json();
      typing.remove();
      addMsg("cand", data.answer, "Candidate");
    } catch (e) {
      typing.remove();
      addMsg("err", "Couldn't reach the backend at " + API_URL +
        ". Check that the server is running and that CORS is enabled. (" + e.message + ")");
    } finally {
      sendBtn.disabled = false; input.disabled = false; input.focus();
    }
  }

  form.addEventListener("submit", e => { e.preventDefault(); ask(input.value); });
</script>
</body>
</html>
